name: Deploy site to GitHub Pages

on:
  push:
    branches: ["claude/lizalogia-portfolio-build-x2vfcm"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble site (exclude repo tooling)
        run: |
          mkdir -p _site
          cp index.html style.css animations.css adaptive.css script.js _site/
          cp .nojekyll _site/ 2>/dev/null || true
          cp -r assets _site/

      - name: Configure Pages (auto-enable)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
